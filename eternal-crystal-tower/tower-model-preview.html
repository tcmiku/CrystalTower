<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>晶塔 · 三维模型检视</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080f20;color:#d3e2ef;font:14px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0 0 8px}p{color:#8dabc3;margin:0 0 20px}a{color:#85e7ed}section{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{border:1px solid #27394e;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#233955,#111f34 68%)}article canvas{display:block;width:100%;aspect-ratio:1/1}article h2{font-size:15px;margin:0;padding:0 18px 18px}nav{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:22px 0}select,button{font:inherit;background:#183148;border:1px solid #4a7389;color:#d9f6fa;padding:8px;border-radius:6px}label{display:flex;align-items:center;gap:8px}input{accent-color:#73ddea}#status{font-size:12px;color:#7395ac}#error{color:#ffa99c;white-space:pre-wrap}@media(max-width:780px){section{grid-template-columns:repeat(2,1fr)}main{padding:18px}}
</style>
<main>
<header><div><h1>晶塔 · 三维模型检视</h1><p>深蓝装甲 / 青紫晶核 / 银金镶边</p></div><a href="/?preview=tower-visual&tier=3">进入战场 →</a></header>
<nav>
<label>炮膛<select id="route"><option value="none">标准晶炮</option><option value="siege">破城炮膛</option><option value="split">裂晶双炮</option></select></label>
<label>状态<select id="state"><option value="off">常态</option><option value="hot">超载</option><option value="overheated">过热</option></select></label>
<label><input id="elements" type="checkbox">元素模块</label>
<label><input id="rotate" type="checkbox">旋转检视</label>
<label><input id="fire" type="checkbox" checked>射击后坐</label>
<label>视角<input id="view" type="range" min="-3.14" max="3.14" step=".01" value="0"></label>
</nav>
<section id="gallery"></section><p id="status"></p><pre id="error"></pre>
</main>
<script type="module">
import {TowerModelRenderer} from './src/tower-model.js';
const names=['01 · 晶芽','02 · 晶柱','03 · 晶冠','04 · 万象晶塔'];
const query=new URLSearchParams(location.search);
const models=names.map((name,tier)=>{
  const card=document.createElement('article');const canvas=document.createElement('canvas');canvas.width=600;canvas.height=600;
  canvas.setAttribute('aria-label',name+'三维模型');const heading=document.createElement('h2');heading.textContent=name;
  const download=document.createElement('a');download.href=`./assets/models/crystal-tower-tier-${tier+1}.glb`;download.download='';download.textContent='GLB ↓';download.style.cssText='float:right;font-size:12px;font-weight:400';heading.append(download);
  card.append(canvas,heading);document.querySelector('#gallery').append(card);
  const model=new TowerModelRenderer();if(query.has('software'))model.gl=null;
  return {canvas,ctx:canvas.getContext('2d'),model,tier};
});
window.addEventListener('error',e=>document.querySelector('#error').textContent+=e.message+'\n');
const input=id=>document.getElementById(id);
let start=performance.now();let frames=0;
function render(now){
 const time=(now-start)/1000;const view=Number(input('view').value)+(input('rotate').checked?time*.25:0);
 for(const {canvas,ctx,model,tier} of models){
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(300,340);ctx.scale(2.4,2.4);
  ctx.strokeStyle='rgba(112,189,219,.12)';ctx.lineWidth=.6;
  for(const r of [50,80,110]){ctx.beginPath();ctx.ellipse(0,38,r,r*.6,0,0,Math.PI*2);ctx.stroke();}
  const enabled=input('elements').checked;
  model.draw(ctx,{tier,cannonRoute:input('route').value,overloadBand:input('state').value,hpRatio:1,elements:{frost:enabled,fire:enabled,lightning:enabled}},-.28,time,{shoot:input('fire').checked?Math.max(0,.28-time%1.5):0},view);ctx.restore();
 }
 if(++frames%30===0)input('status').textContent=`${models.every(m=>m.model.gl)?'WebGL · 深度缓冲':'软件网格回退'} · 四阶网格 ${models.map(m=>m.model.model.parts.reduce((n,p)=>n+p.vertices.length/30,0)).join(' / ')} 三角面`;
 requestAnimationFrame(render);
}requestAnimationFrame(render);
</script>
</html>
