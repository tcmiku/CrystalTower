<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>模块实体挂载 · 晶塔工坊</title>
<style>*{box-sizing:border-box}body{margin:0;background:#08131f;color:#d3e6ed;font:14px system-ui}main{max-width:1180px;margin:auto;padding:32px}h1{font-size:28px;margin:8px 0}p{color:#89a5b7;line-height:1.7}.hero{display:grid;grid-template-columns:1fr 300px;gap:24px;background:radial-gradient(ellipse at 40% 50%,#254558,#0e2132 65%);border:1px solid #35566a;border-radius:16px;padding:20px;margin:24px 0}.hero canvas{width:100%;max-height:520px;object-fit:contain}button,select{background:#18384a;border:1px solid #4a7285;border-radius:6px;padding:10px;color:#e0f4ff;margin:5px 0;width:100%;font:inherit;cursor:pointer}label{display:block;margin:14px 0 6px;color:#9abcca}input{width:100%;accent-color:#8ed9ed}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#102333;border:1px solid #2b4758;border-radius:12px;padding:14px}.card canvas{width:100%;height:auto}.card h2{font-size:16px;margin:0}.card p{font-size:12px;margin-bottom:0}.tag{color:#70d9eb;font-size:12px;letter-spacing:3px}.note{font-size:12px}.meta{margin-top:12px;padding:10px 12px;border:1px solid #2f5266;border-radius:8px;background:#0c1c2a;font-size:12px;line-height:1.6;color:#9fc2d4}.meta strong{color:#8eeaff}.links{display:flex;gap:12px;margin:0 0 8px;font-size:13px}.links a{color:#85e7ed}@media(max-width:720px){main{padding:16px}.hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}</style>
<main><div class="tag">CRYSTAL TOWER / MODULE WORKSHOP</div><h1>永耀晶塔 · 塔身外挂模块</h1><p>完整圆形塔身、中央悬浮晶核和分层装甲。模块挂在同一圈安装带上，按拼装格沿塔身圆周均匀分布，满配时环绕展开、不上下堆叠。</p>
<div class="links"><a href="./tower-model-preview.html">经典塔身检视 →</a><a href="/?preview=tower-visual">战场预览 →</a></div>
<section class="hero"><canvas id="assembly" width="800" height="650" aria-label="防御塔模块挂载三维预览"></canvas><aside><h2>组装效果</h2>
<label for="build">防线配置</label><select id="build">
<option value="mixed">重炮 + 环刃 + 霜棱</option>
<option value="expansion">新模块 · 聚怪轰击与无人机整备</option>
<option value="expansionTwo">第二批 · 射线、晶雷、导桥与储能</option>
<option value="hive">机库 + 火焰 + 雷鸣</option>
<option value="guard">竖置重炮 + 护盾</option>
<option value="outer">机库 / 反应器 / 护盾</option>
<option value="full">满配 · 双炮 + 刃 + 机库 + 反应器</option>
<option value="empty">全部拆卸</option>
</select>
<label for="tier">塔身阶级（扩大半径与容量）</label><input id="tier" type="range" min="0" max="3" value="1">
<label for="level">模块等级</label><input id="level" type="range" min="1" max="3" value="2">
<label for="view">查看角度</label><input id="view" type="range" min="-180" max="180" value="-25">
<button id="orbit">自动环视</button><button id="fire">演示模块攻击</button>
<div class="meta" id="bayInfo"></div>
<p class="note">模型与游戏共用同一套网格和深度渲染。阶级只扩大塔身半径与容量，模块始终在同一安装环上。</p>
</aside></section><section class="cards" id="cards"></section></main>
<script type="module">
import {TowerModelRenderer} from './src/tower-model.js';
import {MODULES} from './src/modules.js';
import {getModelLayout} from './src/tower-model.js';
const renderer = new TowerModelRenderer(), canvas=document.querySelector('#assembly'), ctx=canvas.getContext('2d');
// Board grid maps each cell to an even bearing on the single mount belt.
const presets={
  mixed:[['cannon',0],['blade',2],['frost',4]],
  expansion:[['gravity',0],['interceptor',2],['mortar',3],['pulse',5],['hangar',6],['service',8]],
  expansionTwo:[['fire',0],['bridge',1],['pulse',2],['mine',3],['capacitor',5],['laser',6]],
  hive:[['hangar',1],['fire',3],['lightning',5]],
  guard:[['cannon',0,1],['shield',2],['pulse',4]],
  outer:[['hangar',6],['frost',8],['shield',11],['fire',2]],
  full:[['pulse',0],['cannon',2],['blade',3],['hangar',5],['frost',6],['fire',8],['lightning',9],['shield',11]],
  empty:[]
};
let orbit=false,last=0,firing=false;
const visual=(modules,tier=1)=>({tier,modules,cannonEnabled:modules.some(m=>['pulse','cannon'].includes(m.id)),cannonRoute:modules.some(m=>m.id==='cannon')?'siege':'none',elements:{},overloadBand:'off',hpRatio:1});
const attackFx=(ids,time)=>Object.fromEntries(ids.map(id=>[`attack-${id}`,firing?Math.max(0,.45-time%1.3):0]));
function updateInfo(modules,tier){
  const layout=getModelLayout(tier);
  const occupied=modules.reduce((n,m)=>n+(MODULES[m.id]?.size??0),0);
  document.querySelector('#bayInfo').innerHTML=`<strong>${layout.slotCount} 格</strong> · 单环安装 · 占用 ${occupied}<br>已装：${modules.map(m=>MODULES[m.id].name).join('、')||'无'}`;
}
function draw(time=0){
  ctx.clearRect(0,0,800,650);ctx.save();ctx.translate(400,365);ctx.scale(2.2,2.2);
  const tier=Number(document.querySelector('#tier').value);
  const modules=presets[document.querySelector('#build').value]
    .filter(([,slot])=>slot<getModelLayout(tier).slotCount)
    .map(([id,slot,rotation=0])=>({id,slot,rotation,level:Number(document.querySelector('#level').value)}));
  updateInfo(modules,tier);
  // Ground guide for the single wall radius
  const r=getModelLayout(tier).radius;
  ctx.strokeStyle='rgba(112,189,219,.14)';ctx.lineWidth=.7;
  ctx.beginPath();ctx.ellipse(0,38,r*1.14,r*1.14*.6,0,0,Math.PI*2);ctx.stroke();
  renderer.draw(ctx,visual(modules,tier),firing?Math.sin(time*.65)*.8:.2,time,{...attackFx(modules.map(m=>m.id),time),shoot:firing?Math.max(0,.28-time%1.3):0},Number(document.querySelector('#view').value)*Math.PI/180);ctx.restore();
}
for(const el of document.querySelectorAll('input,select'))el.addEventListener('input',()=>draw());
document.querySelector('#fire').onclick=()=>{firing=!firing;document.querySelector('#fire').textContent=firing?'停止攻击演示':'演示模块攻击'};
document.querySelector('#orbit').onclick=()=>{orbit=!orbit;document.querySelector('#orbit').textContent=orbit?'停止环视':'自动环视'};
const cardViews=[];
const observer=new IntersectionObserver(entries=>{for(const entry of entries){const v=cardViews.find(v=>v.canvas===entry.target);if(v)v.visible=entry.isIntersecting}});
const descriptions={pulse:'晶能导轨流光 · 独立炮口闪光',cannon:'蓄能光环 · 导轨充能与后坐',blade:'高速旋转环刃 · 绿色弧形拖尾',hangar:'机库航灯 · 出舱扫描光',shield:'向外扩散的六边形护盾波',frost:'旋绕冰晶 · 飘落霜粒',fire:'炉芯焰舌 · 上升余烬',lightning:'双极跳跃电弧 · 旋转电场'};
Object.assign(descriptions,{mortar:'仰角曲射炮管 · 蓝白炮口与后坐',gravity:'悬浮引力环 · 紫色牵引核心',interceptor:'旋转截光环 · 储弹晶点与拦截闪光',service:'双侧整备轨 · 绿色输能灯带'});
Object.assign(descriptions,{laser:'双轨聚焦镜 · 炽橙束流与散热鳍',mine:'三联晶雷架 · 预装晶簇与投放轨',bridge:'双端共鸣柱 · 横纵直连输能桥',capacitor:'四晶储能匣 · 青绿蓄能晶体'});
for(const [id,meta] of Object.entries(MODULES)){const card=document.createElement('article');card.className='card';card.innerHTML=`<h2 style="color:${meta.color}">${meta.name}</h2><canvas width="400" height="330" aria-label="${meta.name}安装效果"></canvas><p>${descriptions[id]}</p>`;document.querySelector('#cards').append(card);const r=new TowerModelRenderer(),c=card.querySelector('canvas').getContext('2d');c.translate(200,205);c.scale(1.65,1.65);r.draw(c,visual([{id,slot:3,rotation:0,level:3}],0),-.3,0,{},-.35);cardViews.push({renderer:r,ctx:c,canvas:card.querySelector('canvas'),id,visible:false});observer.observe(card.querySelector('canvas'))}
draw();function frame(t){if(t-last>40){const v=document.querySelector('#view');if(orbit)v.value=(Number(v.value)+1+180)%360-180;draw(t/1000);for(const v of cardViews)if(v.visible){v.ctx.save();v.ctx.setTransform(1,0,0,1,0,0);v.ctx.clearRect(0,0,400,330);v.ctx.restore();v.renderer.draw(v.ctx,visual([{id:v.id,slot:3,rotation:0,level:3}],0),-.3,t/1000,{...attackFx([v.id],t/1000),shoot:firing?Math.max(0,.28-(t/1000)%1.3):0},-.35)}last=t}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
