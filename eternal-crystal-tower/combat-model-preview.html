<script type="module">
import {EnemyModelRenderer} from './src/enemy-model.js';
import {BladeModelRenderer} from './src/blade-model.js';
const views=[...document.querySelectorAll('canvas')].map(canvas=>({canvas,ctx:canvas.getContext('2d'),type:canvas.dataset.type,renderer:canvas.dataset.type==='blade'?new BladeModelRenderer():new EnemyModelRenderer({resolution:1200})}));
let spinning=true,time=0,last=0;
document.querySelector('#spin').onclick=()=>{spinning=!spinning;document.querySelector('#spin').textContent=spinning?'暂停旋转':'继续旋转'};
function frame(ms){if(spinning)time+=Math.min(.05,(ms-last)/1000);last=ms;
for(const {canvas,ctx,type,renderer} of views){ctx.clearRect(0,0,550,330);
if(type==='blade'){ctx.save();ctx.translate(275,165);renderer.drawBlade(ctx,time*2.8,time,4.8,false,.5);ctx.restore();}
else renderer.drawEnemy(ctx,{type,x:275,y:185,id:0,radius:17,hitFlash:0},time,time*.45+.65,3.8);}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
